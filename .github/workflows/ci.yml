name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        run: python -m pip install --upgrade pip ruff
      - name: ruff
        run: ruff check family_abm tests tools experiments

  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.12", "3.13"]
        include:
          # Windows 单独跑一个版本：本项目的路径处理与 Web 资源打包都涉及平台差异
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（含测试依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: 运行测试
        run: python -m pytest tests/ -q

  package:
    name: 打包与安装冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建 wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: 干净环境安装并验证
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install dist/*.whl httpx
          cd /tmp
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/tools/verify_install.py"
