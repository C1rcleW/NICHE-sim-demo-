name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        # 钉住版本：ruff 的默认规则集会随版本变化，浮动安装会让 CI 突然变红
        # （0.15 → 0.17 曾让本项目多出 179 项告警）。规则集本身也在
        # pyproject.toml 的 [tool.ruff.lint] select 中显式声明。
        run: python -m pip install --upgrade pip "ruff==0.17.0"
      - name: ruff
        run: ruff check family_abm tests tools experiments

  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（含测试依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: 运行测试
        run: python -m pytest tests/ -q

  test-windows:
    # Windows 覆盖路径处理与 Web 资源定位的平台差异。
    # 排除 packaging 标记：构建 wheel 与 pip --target 安装对运行环境敏感
    # （磁盘、杀软、路径长度），已由下面的 package job 在标准环境完整覆盖。
    # 单独成 job（而非矩阵的一行）是为了避免向 pytest 传空的 -m 参数——
    # 空串参数在 bash 与 PowerShell 下语义不同。
    name: 测试 (Python 3.12 / Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（含测试依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: 运行测试（排除环境敏感的构建/安装测试）
        # -rf 打印失败摘要，--tb=long 保留完整回溯：Windows 上曾出现本地无法复现的
        # 失败，完整的失败定位信息是排查前提。PYTHONUTF8 避免中文输出被代码页转码。
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests/ -q -m "not packaging" -rf --tb=long

  package:
    name: 打包与安装冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建 wheel
        run: |
          python -m pip install --upgrade pip build "ruff==0.17.0"
          python -m pip install -e ".[dev]"
          python -m build --wheel
      - name: 打包相关测试（构建 / 安装 / 元数据契约）
        # Windows job 排除了 packaging 标记，因此在这里完整跑一遍
        run: python -m pytest tests/ -q -m "packaging"
      - name: 干净环境安装并验证
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install dist/*.whl httpx
          # 必须用 --import-only：不带参数时脚本会要求 target 目录并直接退出 2。
          # 同时必须从仓库外运行，否则 sys.path[0] 会让仓库源码冒充已安装副本。
          cd /tmp
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/tools/verify_install.py" --import-only

  release:
    # 打 v* tag 时自动构建 wheel + sdist 并附加到对应的 GitHub Release。
    # 这样发布流程不依赖本机环境，"v0.2.0 的产物由 v0.2.0 的提交构建"也可追溯。
    # 正文不在此处设置：Release 标题与说明由仓库所有者在 GitHub 上填写，
    # 避免自动覆盖人工润色的发布说明。
    if: startsWith(github.ref, 'refs/tags/v')
    name: 发布产物（打 tag 时触发）
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建 wheel 与 sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: 校验产物版本号与 tag 一致
        # tag 是 v0.1.0 而产物是 family_abm-0.2.0 这类不一致必须挡在这里，
        # 否则会把版本号错误的产物发出去
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ls dist/
          for f in dist/*; do
            case "$(basename "$f")" in
              *"$TAG"*) ;;
              *) echo "产物 $f 的版本号与 tag $GITHUB_REF_NAME 不一致"; exit 1 ;;
            esac
          done
          echo "版本号校验通过：$TAG"
      - name: 附到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
