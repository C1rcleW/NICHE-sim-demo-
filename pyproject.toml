[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "family_abm"
version = "0.1.0"
description = "Family social micro-niche agent-based modeling framework with intergenerational influence dynamics, Erikson-stage susceptibility, Lanchester-type ODE fitting and a FastAPI dashboard"
readme = "README.md"
# 最低 3.10：Pydantic 在**类创建时**求值注解（不像普通注解那样被
# `from __future__ import annotations` 延迟），因此 `int | None` 这类写法
# 需要运行时的 `|` 支持。Python 3.9 已于 2025-10 终止支持，不再兼容。
requires-python = ">=3.10"
authors = [{ name = "C1rcleW" }]
keywords = [
    "agent-based-model",
    "computational-social-science",
    "social-niche",
    "intergenerational-transmission",
    "life-course",
    "erikson",
    "family-stress-model",
    "ode",
    "lanchester",
    "simulation",
    "social-policy",
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    # 注意：不使用 "License :: OSI Approved :: ..." 分类器。
    # 上面已用 SPDX 表达式 license = "MIT" 声明授权；两者同时出现会被 setuptools
    # 拒绝（License classifiers have been superseded by license expressions）。
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Sociology",
]

# 单一真源：这里是唯一声明运行时依赖的地方。
# 注意 scipy / matplotlib / pydantic 是 import family_abm 时的硬依赖：
#   family_abm/__init__.py -> .fitting (scipy) 与 .viz (matplotlib)
#   family_abm/web/app.py  -> pydantic
# networkx 只在 plot_family_network() 内部惰性导入，因此放入 [viz] extra。
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# httpx 是 fastapi.testclient 的必需依赖，tools/verify_install.py 的 HTTP 端到端
# 依赖它，因此必须出现在 dev extra 中，否则按声明安装也会让冒烟退化为跳过。
# python-docx 供 tools/build_research_doc.py 与 export_research_md.py 使用。
# ruff 钉住版本：其默认规则集会随版本变化，浮动安装会让本地与 CI 结果不一致
dev = ["pytest>=7.0", "build>=0.10", "httpx>=0.24", "python-docx>=1.0", "ruff==0.17.0"]
viz = ["networkx>=2.6"]

[project.urls]
Repository = "https://github.com/C1rcleW/NICHE-sim-Framework"
Issues = "https://github.com/C1rcleW/NICHE-sim-Framework/issues"

# ── 工具配置 ────────────────────────────────────────────────────────────────

# 忽略规则说明：
#   E501   行长度由人类判断，中文注释按字符数计长会误报
#   E701   个别紧凑的单行分支（if x: return y）可读性更好
#   RUF001/2/3  "歧义 Unicode 字符"检查面向英文代码库（防止同形字混淆）。
#          本项目文档与注释以中文为主，中文标点（「」、全角括号、破折号）
#          会被全部命中，产生上千条无意义告警。
#   RUF012 测试与示例里的类属性默认值不需要 ClassVar 标注
#   BLE001 顶层兜底 except Exception 是本项目刻意的设计（见 fitter / web/app.py）
#   PLW0602 模块级单例的 global 声明
#   E402  experiments/ 与 tools/ 下的脚本需要先插入 sys.path 再导入本项目，
#         因此模块级导入必须排在 sys.path 操作之后
[tool.ruff]
target-version = "py310"
line-length = 110

# 显式列出规则集，而不是依赖 ruff 的默认全集：
# 默认集会随版本变化（0.15 → 0.17 让本项目多出 179 项），显式声明才能稳定。
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "E701", "E402", "RUF001", "RUF002", "RUF003", "RUF012", "BLE001", "PLW0602"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试会构建 wheel 并安装到临时环境，默认超时不够时按需调大
addopts = "-q"
# packaging 标记：这些测试会调用 pip / build 并跨进程安装，对运行环境敏感
# （磁盘、杀毒软件、路径长度、pip 版本）。单独标记后可以在不同平台上选择性运行。
markers = [
    "packaging: 需要 pip/build 的构建与安装测试（环境敏感）",
]

# 显式列出包，避免把 tests/ 与 tools/ 一并装进 wheel
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["family_abm*"]

# Web 前端资源必须随 wheel/sdist 分发，否则 StaticFiles/Jinja2Templates 在安装后找不到目录
[tool.setuptools.package-data]
family_abm = [
    "web/templates/**/*.html",
    "web/static/**/*.css",
    "web/static/**/*.js",
]
